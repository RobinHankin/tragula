name: Build all example_article PDF files

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          texlive-latex-extra \
          texlive-fonts-recommended \
          texlive-bibtex-extra \
          texlive-luatex \
          texlive-xetex \
          texlive-fonts-extra \
          texlive-science \
	  latexmk

    - name: Set up R
      uses: r-lib/actions/setup-r@v2


    - name: Install spray package from CRAN
      run: |
        Rscript -e 'install.packages("spray"      , repos="https://cloud.r-project.org")'
        Rscript -e 'install.packages("evitaicossa", repos="https://cloud.r-project.org")'
        Rscript -e 'install.packages("quadform"   , repos="https://cloud.r-project.org")'
        Rscript -e 'install.packages("elliptic"   , repos="https://cloud.r-project.org")'
        Rscript -e 'install.packages("freegroup"  , repos="https://cloud.r-project.org")'
        Rscript -e 'install.packages("mvp"        , repos="https://cloud.r-project.org")'
        Rscript -e 'install.packages("stokes"     , repos="https://cloud.r-project.org")'
        Rscript -e 'install.packages("vfunc"      , repos="https://cloud.r-project.org")'
        Rscript -e 'install.packages("hypergeo"   , repos="https://cloud.r-project.org")'
        Rscript -e 'install.packages("Deriv"      , repos="https://cloud.r-project.org")'
        Rscript -e 'install.packages("onion"      , repos="https://cloud.r-project.org")'

    - name: make a directory for the finished example articles
      run: |
        mkdir -p example_articles
        export TEXINPUTS=".:$(Rscript -e 'cat(file.path(R.home("share"), "texmf", "tex", "latex"))'):$TEXINPUTS"


    - name: Build all example articles
      run: |
        git clone https://github.com/robinhankin/spray.git
        cp spray/vignettes/* .

        chmod +x ./tragularize
        ./tragularize spray.Rnw
        R CMD Sweave example_article_spray.Rnw
        latexmk -pdf example_article_spray.tex
        cp example_article_spray.pdf example_articles/


        git clone https://github.com/robinhankin/crinkled_arc.git
        cp -r crinkled_arc/* .
        R CMD Sweave example_article_crinkled_arc.Rnw
        latexmk -pdf example_article_crinkled_arc.tex
        cp example_article_crinkled_arc.pdf example_articles/


        git clone https://github.com/robinhankin/evitaicossa.git
        cp evitaicossa/inst/evitaicossa_tragula.Rnw ./evitaicossa.Rnw
        cp evitaicossa/inst/evitaicossa.bib .
        cp evitaicossa/man/figures/evitaicossa.png .

        chmod +x ./tragularize
        ./tragularize evitaicossa.Rnw
        R CMD Sweave example_article_evitaicossa.Rnw
        latexmk -pdf example_article_evitaicossa.tex
        cp example_article_evitaicossa.pdf example_articles/


        git clone https://github.com/robinhankin/quadform.git
        cp quadform/inst/quadform_tragula.Rnw ./example_article_quadform.Rnw
        cp quadform/inst/quadform.bib .
        cp quadform/man/figures/quadform.png .
        R CMD Sweave example_article_quadform.Rnw
        latexmk -pdf example_article_quadform.tex
        cp example_article_quadform.pdf example_articles/


        git clone https://github.com/robinhankin/elliptic.git
        cp elliptic/vignettes/residuetheorem.Rnw ./residuetheorem.Rnw
        cp elliptic/vignettes/elliptic.bib .
        ./tragularize residuetheorem.Rnw 
        R CMD Sweave example_article_residuetheorem.Rnw
        latexmk -pdf example_article_residuetheorem.tex
        cp example_article_residuetheorem.pdf example_articles/


        git clone https://github.com/robinhankin/freegroup.git
        cp freegroup/vignettes/* .
        ./tragularize freegroup.Rnw 
        R CMD Sweave example_article_freegroup.Rnw
        latexmk -pdf example_article_freegroup.tex
        cp example_article_freegroup.pdf example_articles/

        git clone https://github.com/robinhankin/mvp.git
        cp mvp/inst/mvp_tragula.Rnw ./example_article_mvp.Rnw
        cp mvp/inst/mvp.bib .
        cp mvp/man/figures/mvp.png .
        cp spray/vignettes/four_dimensional_knight.pdf .
        R CMD Sweave example_article_mvp.Rnw
        latexmk -pdf example_article_mvp.tex
        cp example_article_mvp.pdf example_articles/


        git clone https://github.com/robinhankin/stokes.git
        cp stokes/inst/stokes_tragula.Rnw ./stokes.Rnw
        cp stokes/vignettes/stokes.bib .
        cp stokes/man/figures/stokes.png .
        ./tragularize stokes.Rnw
        R CMD Sweave example_article_stokes.Rnw 
        latexmk -pdf example_article_stokes.tex
        cp example_article_stokes.pdf example_articles/


        git clone https://github.com/robinhankin/vfunc.git
        cp vfunc/inst/vfunc_tragula.Rnw ./example_article_vfunc.Rnw
        cp vfunc/vignettes/vfunc.bib .
        cp vfunc/man/figures/vfunc.png .
        R CMD Sweave example_article_vfunc.Rnw
        latexmk -pdf example_article_vfunc.tex
        cp example_article_vfunc.pdf example_articles/


    - name: Upload PDF
      uses: actions/upload-artifact@v4
      with:
        name: example-articles
        path: example_articles/
