name: Build Example PDFs

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          texlive-latex-extra \
          texlive-fonts-recommended \
          texlive-bibtex-extra \
          texlive-luatex \
          texlive-xetex

    - name: Set up R
      uses: r-lib/actions/setup-r@v2

    - name: Build spray example
      run: |
        git clone https://github.com/robinhankin/spray.git
        cp spray/vignettes/* .

        chmod +x scripts/tragularize
        scripts/tragularize spray.Rnw

        R CMD Sweave example_article_spray.Rnw
        pdflatex example_article_spray
        bibtex example_article_spray
        pdflatex example_article_spray
        pdflatex example_article_spray

    - name: Upload PDF
      uses: actions/upload-artifact@v4
      with:
        name: example-spray
        path: example_article_spray.pdf
